<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <defs>
    <linearGradient id="lanyard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="badgeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="30%" stop-color="#E8E8E8"/>
      <stop offset="70%" stop-color="#D8D8D8"/>
      <stop offset="100%" stop-color="#C8C8C8"/>
    </linearGradient>
    <linearGradient id="metalClip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0D0D0"/>
      <stop offset="50%" stop-color="#A0A0A0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1"/>
      <feComposite operator="out" in="SourceGraphic"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Lanyard strap -->
  <path d="M160 0 Q140 40 130 100 Q115 180 120 260 Q125 320 140 380 Q150 420 130 460 Q110 500 100 520" 
        stroke="url(#lanyard)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M160 0 Q140 40 130 100 Q115 180 120 260 Q125 320 140 380 Q150 420 130 460 Q110 500 100 520" 
        stroke="#3B82F6" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Lanyard coil at bottom -->
  <ellipse cx="105" cy="500" rx="40" ry="18" fill="url(#lanyard)" opacity="0.9"/>
  <ellipse cx="105" cy="500" rx="32" ry="14" fill="#3B82F6" opacity="0.3"/>

  <!-- Badge body -->
  <g filter="url(#shadow)">
    <rect x="130" y="60" width="240" height="340" rx="16" fill="url(#badgeBody)"/>
    <!-- Subtle edge highlight -->
    <rect x="130" y="60" width="240" height="340" rx="16" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <rect x="131" y="61" width="238" height="338" rx="15" fill="none" stroke="#000" stroke-width="0.5" opacity="0.1"/>
  </g>

  <!-- Metal clip at top -->
  <rect x="185" y="48" width="30" height="30" rx="4" fill="url(#metalClip)"/>
  <rect x="190" y="52" width="20" height="8" rx="2" fill="#999" opacity="0.5"/>
  <rect x="193" y="44" width="14" height="10" rx="3" fill="url(#metalClip)" stroke="#777" stroke-width="0.5"/>

  <!-- Blue logo square -->
  <rect x="200" y="110" width="80" height="80" rx="8" fill="#1A6BDB"/>
  <!-- White E in circle -->
  <circle cx="240" cy="150" r="30" stroke="white" stroke-width="5" fill="none"/>
  <path d="M225 135h30M225 150h22M225 165h30" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- EVOLECT text -->
  <text x="250" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="32" fill="#1a1a1a" letter-spacing="2">EVOLECT</text>

  <!-- Volunteer text -->
  <text x="250" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="18" fill="#555">Volunteer</text>

  <!-- Small green dot -->
  <circle cx="240" cy="340" r="3" fill="#22c55e" opacity="0.6"/>
</svg>
